name: Sync Google Doc to index.html

on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build site from Google Doc
        run: python sync_doc.py

      - name: Commit and push if changed
        run: |
          git config user.name "doc-sync-bot"
          git config user.email "doc-sync-bot@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Sync doc"
          git push
